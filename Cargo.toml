[package]
name = "hpwnr"
version = "0.1.0"
edition = "2021"
description = "Command-line Happ and v2RayTun subscription-link decryptor/encryptor"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
aes-gcm = "0.10"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
url = "2"
regex = "1"
thiserror = "1"

[features]
default = ["fetch"]
fetch = ["ureq", "ring"]

[dependencies.ureq]
version = "2"
optional = true
features = ["tls"]

[dependencies.ring]
version = "0.17"
optional = true
