name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check
      - run: cargo check --no-default-features

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            asset: linux-x86_64
            tool: cross
            variant: full
            ext: ""
          - target: x86_64-unknown-linux-musl
            asset: linux-x86_64
            tool: cross
            variant: lite
            ext: ""
          - target: aarch64-linux-android
            asset: android-aarch64
            tool: cross
            variant: full
            ext: ""
          - target: aarch64-linux-android
            asset: android-aarch64
            tool: cross
            variant: lite
            ext: ""
          - target: armv7-linux-androideabi
            asset: android-armv7
            tool: cross
            variant: full
            ext: ""
          - target: armv7-linux-androideabi
            asset: android-armv7
            tool: cross
            variant: lite
            ext: ""
          - target: x86_64-pc-windows-gnu
            asset: windows-x86_64
            tool: cross
            variant: full
            ext: ".exe"
          - target: x86_64-pc-windows-gnu
            asset: windows-x86_64
            tool: cross
            variant: lite
            ext: ".exe"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.tool == 'cross'
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build
        run: |
          FEATURES=""
          [ "${{ matrix.variant }}" = "lite" ] && FEATURES="--no-default-features"
          ${{ matrix.tool }} build --release $FEATURES --target ${{ matrix.target }}
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          suffix=""
          [ "${{ matrix.variant }}" = "lite" ] && suffix="-lite"
          cp "target/${{ matrix.target }}/release/hpwnr${{ matrix.ext }}" "dist/hpwnr${suffix}-${{ matrix.asset }}${{ matrix.ext }}"
      - uses: actions/upload-artifact@v4
        with:
          name: hpwnr${{ matrix.variant == 'lite' && '-lite' || '' }}-${{ matrix.asset }}
          path: dist/*
